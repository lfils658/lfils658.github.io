<body style="padding: 0px; margin: 0px;">
    <br><br><br>
    <div id="greeting" class="imgText">Good <span id="tod"></span>, Liam</div>

    <div id="time" class="imgText"></div>

    <div id="search-container">
            <form>

            </form>
            <!--<div id="status"></div>-->
  			<div id="results"></div>

    <script>
        function updateClock() {
            const now = new Date();

            // Format Time (HH:MM:SS) with leading zeros
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;

            // Format Date (DAY, MONTH DD, YYYY)
            const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
            const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
            
            const dayName = days[now.getDay()];
            const monthName = months[now.getMonth()];
            const dateNum = String(now.getDate()).padStart(2, '0');
            const year = now.getFullYear();

            document.getElementById('date').textContent = `${dayName}, ${monthName} ${dateNum}, ${year}`;
        }

        // Run immediately on page load
        updateClock();
        
        // Update every single second
        setInterval(updateClock, 1000);
    </script>
    <script>
            function updateTimeOfDay() {
                    const tod = document.getElementById("tod");
                    const hour = new Date().getHours();

                    let label;
                    if (hour >= 5 && hour < 12) {
                            label = "morning";
                    } else if (hour >= 12 && hour < 18) {
                            label = "afternoon";
                    } else {
                            label = "evening";
                    }

                    tod.textContent = label;
            }

            // run once on load
            updateTimeOfDay();

            // optional: update every minute
            setInterval(updateTimeOfDay, 60000);
    </script>
    <script>
        const outputDiv = document.getElementById('weather-output');

        // Clean default fallback coordinates (New York City) if GPS is denied/blocked
        const DEFAULT_LAT = 40.7128;
        const DEFAULT_LON = -74.0060;
        const DEFAULT_LABEL = "New York (Fallback)";

        // WMO Weather Interpretation Codes Map
        const weatherCodes = {
            0: "Clear", 1: "Mostly Clear", 2: "Partly Cloudy", 3: "Overcast",
            45: "Fog", 48: "Depositing Rime Fog", 51: "Light Drizzle", 53: "Moderate Drizzle",
            55: "Dense Drizzle", 56: "Light Freezing Drizzle", 57: "Dense Freezing Drizzle",
            61: "Slight Rain", 63: "Moderate Rain", 65: "Heavy Rain", 66: "Light Freezing Rain",
            67: "Heavy Freezing Rain", 71: "Slight Snow Fall", 73: "Moderate Snow Fall",
            75: "Heavy Snow Fall", 77: "Snow Grains", 80: "Slight Rain Showers",
            81: "Moderate Rain Showers", 82: "Violent Rain Showers", 85: "Slight Snow Showers",
            86: "Heavy Snow Showers", 95: "Thunderstorm", 96: "Thunderstorm with Slight Hail",
            99: "Thunderstorm with Heavy Hail"
        };

        async function fetchWeather(lat, lon, locationLabel) {
            try {
                outputDiv.innerText = `Fetching weather for ${locationLabel}...`;
                
                // Added a cache-busting timestamp (&_nocache=) to prevent browser-level request dropping
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit&precipitation_unit=inch&timezone=auto&_nocache=${Date.now()}`;
                
                // Explicitly enforcing CORS mode headers to get through local file constraints
                const response = await fetch(url, { method: 'GET', mode: 'cors' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                const current = data.current;

                // Translate the WMO integer code to a string description
                const weatherDesc = weatherCodes[current.weather_code] || `Code ${current.weather_code}`;

                // Simplified output showing only Location, Temp, and Condition
                outputDiv.innerText = `Conditions for ${locationLabel}: ${current.temperature_2m}°F ${weatherDesc}`;
            } catch (error) {
                outputDiv.innerText = `API Error: ${error.message}. Your browser or extension is blocking outbound requests.`;
            }
        }

        // Initialize with built-in browser geolocation
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    fetchWeather(lat, lon, `${lat.toFixed(2)}°, ${lon.toFixed(2)}°`);
                },
                (error) => {
                    console.warn("Geolocation denied/failed, using fallback.", error);
                    fetchWeather(DEFAULT_LAT, DEFAULT_LON, DEFAULT_LABEL);
                },
                { timeout: 4000 }
            );
        } else {
            fetchWeather(DEFAULT_LAT, DEFAULT_LON, DEFAULT_LABEL);
        }
    </script>
    <script>
        function checkViewport() {
                if (window.innerWidth > window.innerHeight) {
                    document.body.style.backgroundImage = "url('https://picsum.photos/1280/720/?blur=2')";

    </script>
  <script>
    let records = [];
    let matches = [];
    let selectedIndex = -1;

    const searchInput = document.getElementById("searchInput");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    fetch("results.csv")
      .then(response => {
        if (!response.ok) {
          throw new Error("Could not load results.csv");
        }

        return response.text();
      })
      .then(csvText => {
        records = parseCSV(csvText);

        searchInput.disabled = false;
        status.textContent = ``;
        searchInput.focus();
      })
      .catch(error => {
        status.textContent = error.message;
      });

    searchInput.addEventListener("input", updateResults);

    searchInput.addEventListener("keydown", event => {
      const query = searchInput.value.trim();

      if (!query) return;

      if (event.key === "ArrowDown") {
        event.preventDefault();

        if (selectedIndex < matches.length) {
          selectedIndex++;
        } else {
          selectedIndex = 0;
        }

        updateSelection();
        return;
      }

      if (event.key === "ArrowUp") {
        event.preventDefault();

        if (selectedIndex > 0) {
          selectedIndex--;
        } else {
          selectedIndex = matches.length;
        }

        updateSelection();
        return;
      }

      if (event.key === "Tab") {
        if (matches.length > 0) {
          event.preventDefault();

          const index = selectedIndex >= 0 && selectedIndex < matches.length
            ? selectedIndex
            : 0;

          searchInput.value = matches[index].NAME;
          updateResults();
        }

        return;
      }

      if (event.key === "Enter") {
        event.preventDefault();

        if (selectedIndex === matches.length) {
          openDuckDuckGo(query);
          return;
        }

        if (selectedIndex >= 0 && matches[selectedIndex]) {
          openRecord(matches[selectedIndex]);
          return;
        }

        if (matches.length > 0) {
          openRecord(matches[0]);
        } else {
          openDuckDuckGo(query);
        }
      }
    });

    function updateResults() {
      const query = searchInput.value.trim().toLowerCase();

      selectedIndex = -1;

      if (!query) {
        matches = [];
        results.innerHTML = "";
        status.textContent = `${records.length} records loaded.`;
        return;
      }

      matches = records.filter(record =>
        record.NAME.toLowerCase().includes(query) ||
        record.ALTNAME.toLowerCase().includes(query)
      );

      results.innerHTML = matches.map((record, index) => `
        <div class="result" data-index="${index}">
          <strong>${escapeHTML(record.NAME)}</strong>
          ${record.ALTNAME ? ` - ${escapeHTML(record.ALTNAME)}` : ""}
        </div>
      `).join("");

      // Always add DuckDuckGo as the final selectable option
      results.innerHTML += `
        <div class="result duck-result" data-index="${matches.length}">
          ${escapeHTML(searchInput.value.trim())} - Search DuckDuckGo
        </div>
      `;

      status.textContent =
        `${matches.length} match${matches.length === 1 ? "" : "es"} found.`;

      document.querySelectorAll(".result").forEach(result => {
        result.addEventListener("mousedown", event => {
          event.preventDefault();

          const index = Number(result.dataset.index);
          selectedIndex = index;
          openSelectedResult();
        });
      });
    }

    function updateSelection() {
      document.querySelectorAll(".result").forEach((result, index) => {
        result.classList.toggle("selected", index === selectedIndex);
      });
    }

    function openSelectedResult() {
      const query = searchInput.value.trim();

      if (selectedIndex === matches.length) {
        openDuckDuckGo(query);
      } else if (matches[selectedIndex]) {
        openRecord(matches[selectedIndex]);
      }
    }

    function openRecord(record) {
      if (record.URL) {
        window.open(record.URL, "_self");
      } else {
        openDuckDuckGo(record.NAME);
      }
    }

    function openDuckDuckGo(query) {
      const url =
        "https://duckduckgo.com/?q=" + encodeURIComponent(query);

      window.open(url, "_self");
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let value = "";
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const character = text[i];
        const nextCharacter = text[i + 1];

        if (character === '"' && insideQuotes && nextCharacter === '"') {
          value += '"';
          i++;
        } else if (character === '"') {
          insideQuotes = !insideQuotes;
        } else if (character === "," && !insideQuotes) {
          row.push(value.trim());
          value = "";
        } else if (
          (character === "\n" || character === "\r") &&
          !insideQuotes
        ) {
          if (character === "\r" && nextCharacter === "\n") {
            i++;
          }

          row.push(value.trim());
          rows.push(row);
          row = [];
          value = "";
        } else {
          value += character;
        }
      }

      if (value || row.length) {
        row.push(value.trim());
        rows.push(row);
      }

      if (!rows.length) return [];

      const headers = rows.shift().map(header =>
        header.replace(/^\uFEFF/, "").trim().toUpperCase()
      );

      return rows
        .filter(row => row.some(value => value !== ""))
        .map(row => {
          const record = {};

          headers.forEach((header, index) => {
            record[header] = row[index] || "";
          });

          return {
            NAME: record.NAME || "",
            ALTNAME: record.ALTNAME || "",
            URL: record.URL || ""
          };
        });
    }

    function escapeHTML(value) {
      return value.replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[character]));
    }
  </script>
